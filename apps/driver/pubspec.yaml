name: pasakay_driver
description: Pasakay driver app — bookings, shifts, profile, and sync via Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  timeago: ^3.7.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
