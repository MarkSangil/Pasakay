name: pasakay_customer
description: Pasakay customer app — terminals, drivers, call/SMS, reviews via Supabase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  url_launcher: ^6.3.2
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
