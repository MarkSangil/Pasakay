name: pasakay_admin
description: Pasakay system admin — web console for drivers, terminals, shifts, and privacy requests.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  google_fonts: ^8.2.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
